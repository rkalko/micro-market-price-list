name: Update prices from Google Sheet

on:
  schedule:
    - cron: "0 4 * * *" # 07:00 МСК, ежедневно
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Convert sheet to prices.json
        run: node scripts/sheet-to-prices.js

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.json
            git commit -m "Update prices from Google Sheet"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # push от GITHUB_TOKEN не запускает workflow с on: push — деплой дёргаем явно
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
